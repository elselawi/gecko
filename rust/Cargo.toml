[package]
name = "gecko_db_rust"
version = "0.0.1"
edition = "2021"
description = "Redb-backed engine for gecko_db. Not published; compiled only in CI."
publish = false

[lib]
name = "gecko_db_rust"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
redb = "4.1.0"
flutter_rust_bridge = "=2.12.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
aes-gcm = "0.10"
getrandom = "0.2"

[dev-dependencies]

# Coverage gate (Rust side): `cargo llvm-cov` is configured in CI. This keeps
# the crate buildable without extra toolchain for local `cargo test`.
[profile.release]
lto = true
