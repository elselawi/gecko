include: package:lints/recommended.yaml

analyzer:
  exclude:
    # Generated Isar/Drift schemas (regenerated by
    # `dart run build_runner build --force-jit`).
    - '**/*.g.dart'

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - prefer_final_locals
    - prefer_final_in_for_each
