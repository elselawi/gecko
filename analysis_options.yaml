include: package:lints/recommended.yaml

analyzer:
  exclude:
    - packages/gecko_db/lib/src/native/generated/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - prefer_final_locals
    - prefer_final_in_for_each
    - unawaited_futures
