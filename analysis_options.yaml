include: package:lints/recommended.yaml

analyzer:
  exclude:
    # the comparative benchmark is its own standalone package
    # (benchmark/pubspec.yaml) with its own analysis options.
    - benchmark/**
    - packages/gecko_db/lib/src/native/generated/**
    # Web-only entries are validated by `dart compile js` + the live browser
    # suites (tool/web_smoke/README.md); the VM analyzer resolves
    # `flutter_rust_bridge`'s IO variant, so web-only symbols (jsEval,
    # ExternalLibrary) cannot be resolved here.
    - tool/web_smoke/**
    - packages/gecko_db/web/**
    - build/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - prefer_final_locals
    - prefer_final_in_for_each
    - unawaited_futures
